name: Validate community packs
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install renderer and bundler
        run: npm install --no-audit --no-fund
      - name: Test game rules, schema, and both campaign/community packs
        run: npm run check
      - name: Smoke-test deployable GitHub Pages base path
        run: |
          npm run build:pages
          npm run verify:pages
      - name: Bundle the portable standalone browser build
        run: npm run build
      - name: Archive browser build
        uses: actions/upload-artifact@v4
        with:
          name: piece-by-piece-web
          path: dist/
