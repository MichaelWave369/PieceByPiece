name: Publish PieceByPiece to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the deployment job may publish; regular build/test has read access.
permissions:
  contents: read

concurrency:
  group: piecebypiece-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The repo currently does not have a lockfile, so npm ci is not valid.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run game and content tests
        run: npm run check

      - name: Build for the PieceByPiece project-site base path
        run: npm run build:pages

      - name: Verify every built asset resolves within the project path
        run: npm run verify:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static game bundle
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish playable website
        id: deployment
        uses: actions/deploy-pages@v5
